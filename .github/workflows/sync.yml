name: sync-rules

on:
  schedule:
    # Daily sync at 00:00 Beijing Time
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the rules branch can be checked out for publishing

      - name: Sync rules
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json, os, re, shutil, urllib.request

          NEW = "/tmp/new"
          os.makedirs(NEW, exist_ok=True)

          _GH_TOKEN = os.environ.get("GH_TOKEN", "")

          def fetch(url, retries=3, auth=False, ua=None):
              for i in range(retries):
                  try:
                      headers = {"User-Agent": ua or "rules-sync/1.0"}
                      if auth and _GH_TOKEN:
                          headers["Authorization"] = f"Bearer {_GH_TOKEN}"
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=30) as r:
                          if r.status == 200:
                              return r.read()
                  except Exception as e:
                      print(f"  retry {i+1}: {e}")
              return None

          def gh_list(repo, path, ref, ext):
              """List files in a GitHub repo directory."""
              url = f"https://api.github.com/repos/{repo}/contents/{path}?ref={ref}"
              data = fetch(url, auth=True)
              if not data:
                  return []
              try:
                  items = json.loads(data)
                  return [x["download_url"] for x in items
                          if x["type"] == "file" and x["name"].endswith(ext)]
              except Exception:
                  return []

          def strip_leading_hash_comments(data):
              """Drop the leading '#' comment block (blackmatrix7 file header:
              # NAME / # AUTHOR / # REPO / # UPDATED / # ... / # TOTAL).
              Only consecutive '#' lines at the very top are removed; rule
              lines and any '#' lines after the first rule are kept.
              2026-11-07: user asked to drop the bm7 header leftovers."""
              try:
                  text = data.decode("utf-8", errors="ignore")
              except Exception:
                  return data
              lines = text.splitlines()
              i = 0
              while i < len(lines) and lines[i].lstrip().startswith("#"):
                  i += 1
              if i == 0 or i >= len(lines):
                  return data
              return ("\n".join(lines[i:]) + "\n").encode("utf-8")

          # Surge .list -> Egern native YAML converter (2026-11-07)
          # Mapping matches the hub's existing QuixoticHeart Egern YAMLs and
          # the Repcz/EgernRules converter (same blackmatrix7 source data).
          # PROCESS-NAME is dropped: Surge manual says Mac-only, Egern has no
          # process rule type, so it never matches on iOS.
          # no_resolve: true is emitted iff the file has any ip/asn set
          # (same pattern as the hub's existing Egern YAMLs).
          _EGERN_TYPE_MAP = {
              "DOMAIN": "domain_set",
              "DOMAIN-SUFFIX": "domain_suffix_set",
              "DOMAIN-KEYWORD": "domain_keyword_set",
              "DOMAIN-WILDCARD": "domain_wildcard_set",
              "IP-CIDR": "ip_cidr_set",
              "IP-CIDR6": "ip_cidr6_set",
              "IP-ASN": "asn_set",
              "USER-AGENT": "user_agent_set",
              "URL-REGEX": "url_regex_set",
              "GEOIP": "geoip_set",
              "DEST-PORT": "dest_port_set",
          }
          _EGERN_DROP_TYPES = {"PROCESS-NAME"}
          _EGERN_IP_KEYS = {"ip_cidr_set", "ip_cidr6_set", "asn_set"}
          _EGERN_KEY_ORDER = ["domain_set", "domain_suffix_set",
                              "domain_keyword_set", "domain_wildcard_set",
                              "ip_cidr_set", "ip_cidr6_set", "asn_set",
                              "user_agent_set", "url_regex_set",
                              "dest_port_set", "geoip_set"]
          _EGERN_PLAIN_SAFE = re.compile(r"[A-Za-z0-9][A-Za-z0-9_.\-/:]*")

          def _egern_yaml_quote(v, always=False):
              if not always and _EGERN_PLAIN_SAFE.fullmatch(v):
                  return v
              return "'" + v.replace("'", "''") + "'"

          def _egern_convert_one(sets, dropped, skipped, rtype, value):
              if rtype in _EGERN_DROP_TYPES:
                  dropped.append("%s,%s" % (rtype, value))
                  return
              key = _EGERN_TYPE_MAP.get(rtype)
              if not key:
                  skipped.append("%s,%s" % (rtype, value))
                  return
              if rtype == "DOMAIN-SUFFIX":
                  value = value.lstrip(".")
              if rtype == "IP-ASN":
                  m = re.fullmatch(r"(?i)AS(\d+)", value)
                  if m:
                      value = m.group(1)
              sets.setdefault(key, set()).add(value)

          def convert_list_to_egern_yaml(text):
              sets = {}
              dropped = []
              skipped = []
              for raw in text.splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#") or line.startswith("//"):
                      continue
                  parts = [p.strip() for p in line.split(",")]
                  if len(parts) < 2:
                      skipped.append(line)
                      continue
                  rtype = parts[0].upper()
                  value = parts[1]
                  # ChinaASN lines carry a trailing "// comment" after the value
                  if rtype == "IP-ASN" and " //" in value:
                      value = value.split(" //", 1)[0].rstrip()
                  # OR,(...) is a logical OR of sub-rules; a rule set is OR
                  # anyway, so flatten it and convert each sub-rule.
                  if rtype == "OR":
                      for inner in re.findall(r"\(([^()]+)\)", line):
                          ip = [p.strip() for p in inner.split(",")]
                          if len(ip) >= 2:
                              _egern_convert_one(sets, dropped, skipped, ip[0].upper(), ip[1])
                          else:
                              skipped.append(inner)
                      continue
                  _egern_convert_one(sets, dropped, skipped, rtype, value)
              out = []
              if any(k in sets for k in _EGERN_IP_KEYS):
                  out.append("no_resolve: true")
              for key in _EGERN_KEY_ORDER:
                  vals = sets.get(key)
                  if not vals:
                      continue
                  out.append("%s:" % key)
                  if key == "asn_set":
                      for v in sorted(vals, key=lambda x: int(x)):
                          out.append("- '%s'" % v)
                  elif key in ("user_agent_set", "url_regex_set"):
                      for v in sorted(vals):
                          out.append("- %s" % _egern_yaml_quote(v, always=True))
                  else:
                      for v in sorted(vals):
                          out.append("- %s" % _egern_yaml_quote(v))
              stats = {"counts": {k: len(v) for k, v in sets.items()},
                       "dropped": len(dropped), "skipped": skipped}
              return "\n".join(out) + "\n", stats

          _RULE_TYPES = {"DOMAIN", "DOMAIN-SUFFIX", "DOMAIN-KEYWORD",
                         "IP-CIDR", "IP-CIDR6", "HOST", "HOST-SUFFIX",
                         "HOST-KEYWORD", "HOST-WILDCARD", "USER-AGENT", "GEOIP"}

          def rule_domain(line):
              """Extract the domain/value from a rule line (for merge dedup)."""
              s = line.strip()
              if not s or s.startswith("#"):
                  return None
              parts = [p.strip() for p in s.split(",")]
              if len(parts) >= 2 and parts[0].upper() in _RULE_TYPES:
                  return parts[1].lstrip(".").lower()
              return parts[0].lstrip(".").lower()

          def sort_rule_file(path, order_map):
              """Sort a .list rule file by rule type (specific rules first)
              and drop blank lines. Used by the 2b/2c merges."""
              _lines = [l for l in open(path, encoding="utf-8").read().splitlines() if l.strip()]
              _lines.sort(key=lambda l: order_map.get(l.split(",", 1)[0].strip().upper(), 99))
              with open(path, "w", encoding="utf-8") as _f:
                  _f.write("\n".join(_lines) + "\n")

          # Filename normalization (QuixoticHeart -> blackmatrix7 conventions)
          RENAME = {
              "adrules": "AdRules", "ai": "AI", "apns": "APNs",
              "apple-cn": "Apple-CN", "apple-proxy": "Apple-Proxy", "apple-tv": "AppleTV",
              "apple": "Apple", "bilibili": "BiliBili",
              "cdn": "CDN", "cn": "CN",
              "cncidr": "CNCIDR", "crypto": "Crypto", 
              "disney": "Disney", "dmca": "DMCA", "douyin": "DouYin",
              "games-cn": "Games-CN",
              "games": "Games", "gfw": "GFW", "google": "Google",
              "httpdns": "HttpDNS", "netflix": "Netflix",
              "private": "Private", "proxy": "Proxy",
              "speedtest": "Speedtest", "spotify": "Spotify", 
              "tiktok": "TikTok", "tld-proxy": "TLD-Proxy", "twitch": "Twitch",
              "youtube": "YouTube",
          }

          # Extra rules from blackmatrix7 (Google overrides QuixoticHeart's).
          # 2026-11-07: Facebook/Whatsapp/Line/VK removed here (deleted
          # at the user's request; the repo allowlist keeps them out)
          # instead of being listed and then skipped in the loop below.
          EXTRA = ["HuYa", "Discord", "Instagram", "Telegram", "Twitter",
                   "NetEaseMusic", "GitHub", "Reddit", "Pixiv",
                   "Google", "ByteDance"]
          CLIENTS = {
              "Loon": {"qdir": "loon", "ext": ".list", "bmdir": "rule/Loon"},
              "Egern": {"qdir": "egern", "ext": ".yaml", "bmdir": "rule/Surge"},
              "Surge": {"qdir": "surge", "ext": ".list", "bmdir": "rule/Surge"},
              "Clash": {"qdir": "meta", "ext": ".list", "bmdir": "rule/Clash"},
              "QuantumultX": {"qdir": "quantumultx", "ext": ".list", "bmdir": "rule/QuantumultX"},
          }

          for client, cfg in CLIENTS.items():
              dest = os.path.join(NEW, client)
              os.makedirs(dest, exist_ok=True)
              ok = 0

              # 2026-11-07: the repo itself is the allowlist. Only rules
              # already in the repo are synced; new upstream rules never
              # auto-appear (user: the repo holds only rules they use).
              # Deleted rules can never come back, so no SKIP list is needed.
              _repo_urls = gh_list("hinokka/rules", client, "rules", cfg["ext"])
              # NOTE: Clash also has .mrs files, so strip the extension with
              # splitext instead of slicing by len(cfg["ext"]) ("CN.mrs"[:-5]
              # is "C", which broke the 2f allowlist and dropped all 7 .mrs).
              # gh_list filters by ext, so list .mrs separately for Clash.
              if client == "Clash":
                  _repo_urls += gh_list("hinokka/rules", client, "rules", ".mrs")
              _repo_stems = set()
              for _u in _repo_urls:
                  _fn = os.path.basename(_u)
                  _repo_stems.add(os.path.splitext(_fn)[0])
              print(f"[{client}] repo allowlist: {len(_repo_stems)} files")

              # 1. QuixoticHeart ruleset
              urls = gh_list("QuixoticHeart/rule-set", cfg["qdir"], "ruleset", cfg["ext"])
              print(f"[{client}] QuixoticHeart: {len(urls)} files")
              for url in urls:
                  # 2026-11-07: check skip BEFORE downloading. The old code
                  # fetched the file first and threw it away; the filename
                  # is already in the URL, so skipped rules are never
                  # downloaded at all.
                  fn = os.path.basename(url)
                  stem = fn[:-len(cfg["ext"])]
                  if stem.lower() == "google":
                      continue  # Google rule comes from blackmatrix7
                  if client == "Clash" and stem.lower() in ("cn", "cncidr", "proxy", "adrules", "tld-proxy"):
                      continue  # 2026-10-31: Clash CN/CNCIDR/Proxy/AdRules served as mrs only, classical .list no longer synced; 2026-11-07: TLD-Proxy also moved to mrs
                  _norm = RENAME.get(stem.lower(), stem)
                  if _norm not in _repo_stems:
                      continue  # not in the repo: new upstream rule, user does not want it
                  data = fetch(url)
                  if not data:
                      print(f"  FAIL {url}")
                      continue
                  fn = _norm + cfg["ext"]
                  with open(os.path.join(dest, fn), "wb") as f:
                      f.write(strip_leading_hash_comments(data))
                  ok += 1

              # 2. blackmatrix7 extras
              for name in EXTRA:
                  if name not in _repo_stems:
                      continue  # not in the repo, do not re-add
                  ext = ".list"  # extras are always .list (Surge-compatible for Egern)
                  url = (f"https://raw.githubusercontent.com/blackmatrix7/ios_rule_script"
                         f"/master/{cfg['bmdir']}/{name}/{name}{ext}")
                  data = fetch(url)
                  if data:
                      with open(os.path.join(dest, f"{name}{ext}"), "wb") as f:
                          f.write(strip_leading_hash_comments(data))
                      ok += 1
                  else:
                      print(f"  FAIL(extra) {name}")
              # 2b. ByteDance: merge DouYin-unique rules (blackmatrix7's ByteDance.list
              # misses snssdk.com etc.; DouYin.list has 3 rules not in ByteDance)
              _bd_path = os.path.join(dest, "ByteDance.list")
              if os.path.exists(_bd_path):
                  _dy_url = (f"https://raw.githubusercontent.com/blackmatrix7/ios_rule_script"
                             f"/master/{cfg['bmdir']}/DouYin/DouYin.list")
                  _dy_data = fetch(_dy_url)
                  if _dy_data:
                      # Compare by domain, not whole line, so same-domain lines
                      # with a different policy suffix are not counted as new rules.
                      _bd_domains = set()
                      for _bl in open(_bd_path, encoding="utf-8", errors="ignore").read().splitlines():
                          _d = rule_domain(_bl)
                          if _d:
                              _bd_domains.add(_d)
                      _added = []
                      for _l in _dy_data.decode("utf-8", errors="ignore").splitlines():
                          _l = _l.strip()
                          _d = rule_domain(_l)
                          if _d and _d not in _bd_domains:
                              _added.append(_l)
                              _bd_domains.add(_d)
                      if _added:
                          with open(_bd_path, "a", encoding="utf-8") as _f:
                              _f.write("\n" + "\n".join(_added) + "\n")
                          print(f"  [ByteDance] merged {len(_added)} DouYin-unique rules")
                      # 2026-11-07: sort by type every run (not only when
                      # something was merged). The appended lines landed
                      # after USER-AGENT / IP-CIDR and 2 of the 3 are
                      # shadowed by base DOMAIN-SUFFIX rules (same
                      # destination, harmless, but wrong order). Loon/QX
                      # skipped the sort on the first pass because their
                      # _added was empty that run.
                      _BD_ORDER = {"DOMAIN": 0, "HOST": 0,
                                   "DOMAIN-SUFFIX": 1, "HOST-SUFFIX": 1,
                                   "DOMAIN-KEYWORD": 2, "HOST-KEYWORD": 2,
                                   "DOMAIN-WILDCARD": 3, "HOST-WILDCARD": 3,
                                   "IP-CIDR": 4, "IP-CIDR6": 4, "GEOIP": 4,
                                   "USER-AGENT": 5, "PROCESS-NAME": 6}
                      sort_rule_file(_bd_path, _BD_ORDER)

              # 2c. GitHub: merge GitHub-related domains from QuixoticHeart gits
              # (2026-11-07) blackmatrix7's GitHub.list (31 rules) is missing
              # GitHub's backend storage domains (github-production-*.s3,
              # productionresultssa*.blob, copilot attachments, arkoselabs)
              # and a few GitHub services (gh.io, ghe.com, github.ai,
              # github.career, githubsupport.com, octocaptcha.com).
              # QuixoticHeart's gits rule has them (76 rules, a superset of
              # GitHub). Merge the GitHub-related ones (skip GitLab/Gitee/
              # GitBook/Gitter) so the GitHub rule stays complete. The Git
              # rule itself is NOT kept (removed 2026-10-18; the repo
              # allowlist keeps it out).
              _gh_path = os.path.join(dest, "GitHub.list")
              if os.path.exists(_gh_path):
                  # 2026-11-07: fetch each client's own gits (QuixoticHeart
                  # ships one per client); Egern keeps surge/gits.list
                  # because its merge target is a Surge-format .list
                  # (egern/gits.yaml is YAML, not appendable).
                  if client == "Egern":
                      _gits_url = ("https://raw.githubusercontent.com/QuixoticHeart/rule-set"
                                   "/ruleset/surge/gits.list")
                  else:
                      _gits_url = ("https://raw.githubusercontent.com/QuixoticHeart/rule-set"
                                   f"/ruleset/{cfg['qdir']}/gits.list")
                  _gits_data = fetch(_gits_url)
                  if _gits_data:
                      _gh_domains = set()
                      for _gl in open(_gh_path, encoding="utf-8", errors="ignore").read().splitlines():
                          _d = rule_domain(_gl)
                          if _d:
                              _gh_domains.add(_d)
                      _EXCLUDE = ("gitlab", "gitee", "gitbook", "gitter")
                      _added = []
                      for _l in _gits_data.decode("utf-8", errors="ignore").splitlines():
                          _l = _l.strip()
                          _d = rule_domain(_l)
                          if not _d or _d in _gh_domains:
                              continue
                          if any(_x in _d for _x in _EXCLUDE):
                              continue
                          _added.append(_l)
                          _gh_domains.add(_d)
                      if _added and client == "QuantumultX":
                          # QX gits lines carry a ,gits policy tag; retag
                          # to ,GitHub to match the GitHub.list file.
                          _added = [(_l.rstrip()[:-5] + ",GitHub") if _l.rstrip().endswith(",gits") else _l
                                    for _l in _added]
                      if _added:
                          with open(_gh_path, "a", encoding="utf-8") as _f:
                              _f.write("\n" + "\n".join(_added) + "\n")
                          print(f"  [GitHub] merged {len(_added)} GitHub-related rules from gits")
                      # 2026-11-07: sort by type every run, not only when
                      # something was merged (same lesson as 2b: a run with
                      # empty _added would otherwise skip the sort forever).
                      # DOMAIN/HOST first, then -SUFFIX, then -KEYWORD.
                      # The appended gits lines were landing after the bm7
                      # DOMAIN-KEYWORD,github line, which shadows 9 of them
                      # (same destination, so harmless, but wrong order).
                      # Blank line dropped in the sort.
                      _TYPE_ORDER = {"DOMAIN": 0, "HOST": 0,
                                     "DOMAIN-SUFFIX": 1, "HOST-SUFFIX": 1,
                                     "DOMAIN-KEYWORD": 2, "HOST-KEYWORD": 2,
                                     "DOMAIN-WILDCARD": 3, "HOST-WILDCARD": 3}
                      sort_rule_file(_gh_path, _TYPE_ORDER)

              # 2d. ChinaASN from missuo/ASN-China (2026-11-01)
              # Surge-format IP-ASN list, synced as ChinaASN.list into
              # Surge, Egern, Loon and QuantumultX. Egern converts it to
              # native .yaml in step 2e below. On fetch failure, keep the
              # repo's old file (Egern prefers the old .yaml).
              # 2026-11-07: every IP-ASN line gets ,no-resolve (missuo
              # carries none; matches the Egern YAML no_resolve and
              # bm7's ChinaASN). 2026-11-07: QuantumultX does NOT get
              # no-resolve (QX does not support it). 2026-11-07: strip
              # all missuo // comments (header lines + trailing org names).
              if client in ("Surge", "Egern", "Loon", "QuantumultX") and "ChinaASN" in _repo_stems:
                  _asn_url = "https://raw.githubusercontent.com/missuo/ASN-China/main/ASN.China.list"
                  _asn_data = fetch(_asn_url)
                  if _asn_data:
                      _asn_text = _asn_data.decode("utf-8", errors="ignore")
                      _out_lines = []
                      for _ln in _asn_text.splitlines():
                          _s = _ln.strip()
                          if not _s or _s.startswith("//"):
                              continue
                          if " //" in _s:
                              _s = _s.split(" //", 1)[0].rstrip()
                          if _s.startswith("IP-ASN,") and client != "QuantumultX" and ",no-resolve" not in _s:
                              _s = _s + ",no-resolve"
                          _out_lines.append(_s)
                      _asn_data = ("\n".join(_out_lines) + "\n").encode("utf-8")
                      with open(os.path.join(dest, "ChinaASN.list"), "wb") as _f:
                          _f.write(_asn_data)
                      ok += 1
                      print(f"  [ChinaASN] ok ({len(_asn_data)} bytes)")
                  else:
                      _old_yaml = os.path.join(client, "ChinaASN.yaml")
                      if client == "Egern" and os.path.exists(_old_yaml):
                          shutil.copy(_old_yaml, os.path.join(dest, "ChinaASN.yaml"))
                          ok += 1
                          print("  [ChinaASN] fetch failed, kept old version")
                      else:
                          _old_fp = os.path.join(client, "ChinaASN.list")
                          if os.path.exists(_old_fp):
                              shutil.copy(_old_fp, os.path.join(dest, "ChinaASN.list"))
                              ok += 1
                              print("  [ChinaASN] fetch failed, kept old version")
                          else:
                              print(f"  [ChinaASN] FAIL {_asn_url}")

              # 2e. Egern: convert Surge .list extras + ChinaASN to native YAML
              # (2026-11-07) The 16 blackmatrix7/missuo rules now ship as
              # native Egern .yaml instead of Surge-compatible .list. Runs
              # after 2b (ByteDance merge), 2c (GitHub merge) and 2d (ChinaASN) so the merged
              # content is converted, not the pre-merge file. The .list
              # files are removed here, so the repo only ever holds .yaml
              # for Egern.
              if client == "Egern":
                  for _name in EXTRA + ["ChinaASN"]:
                      _lp = os.path.join(dest, "%s.list" % _name)
                      if not os.path.exists(_lp):
                          continue
                      with open(_lp, encoding="utf-8", errors="ignore") as _f:
                          _text = _f.read()
                      _yaml_text, _stats = convert_list_to_egern_yaml(_text)
                      with open(os.path.join(dest, "%s.yaml" % _name), "w", encoding="utf-8") as _f:
                          _f.write(_yaml_text)
                      os.remove(_lp)
                      print("  [Egern YAML] %s.yaml: %s (dropped PROCESS-NAME: %d, skipped: %d)" % (
                          _name, _stats["counts"], _stats["dropped"], len(_stats["skipped"])))

              # 2f. Clash MRS for CN / CNCIDR / Proxy / AdRules / TLD-Proxy (2026-10-31, memory fix; TLD-Proxy added 2026-11-07)
              # QuixoticHeart already splits meta into domain/ipcidr/mrs;
              # only these large rules switch to mrs; all other Clash
              # rules stay classical .list.
              # Upstream name trap: the IP split is meta/ipcidr/cn.mrs,
              # not cncidr.mrs. On fetch failure, keep the repo's old .mrs.
              if client == "Clash":
                  _mrs_map = {
                      "CN.mrs": "https://raw.githubusercontent.com/QuixoticHeart/rule-set/ruleset/meta/domain/cn.mrs",
                      "CNCIDR.mrs": "https://raw.githubusercontent.com/QuixoticHeart/rule-set/ruleset/meta/ipcidr/cn.mrs",
                      # Proxy: upstream has two proxy.mrs files (domain/ and ipcidr/);
                      # the repo is flat, so the ipcidr one is renamed Proxy-IP.mrs.
                      "Proxy.mrs": "https://raw.githubusercontent.com/QuixoticHeart/rule-set/ruleset/meta/domain/proxy.mrs",
                      "Proxy-IP.mrs": "https://raw.githubusercontent.com/QuixoticHeart/rule-set/ruleset/meta/ipcidr/proxy.mrs",
                      # AdRules: same split as Proxy; the ipcidr one is
                      # renamed AdRules-IP.mrs. Domain mrs drops the
                      # classical KEYWORD/REGEX/WILDCARD rows.
                      "AdRules.mrs": "https://raw.githubusercontent.com/QuixoticHeart/rule-set/ruleset/meta/domain/adrules.mrs",
                      "AdRules-IP.mrs": "https://raw.githubusercontent.com/QuixoticHeart/rule-set/ruleset/meta/ipcidr/adrules.mrs",
                      # TLD-Proxy: single domain-only mrs (no IP rows, no ipcidr split).
                      "TLD-Proxy.mrs": "https://raw.githubusercontent.com/QuixoticHeart/rule-set/ruleset/meta/domain/tld-proxy.mrs",
                  }
                  for _fn, _url in _mrs_map.items():
                      _data = fetch(_url)
                      if _data:
                          with open(os.path.join(dest, _fn), "wb") as _f:
                              _f.write(_data)
                          ok += 1
                          print(f"  [Clash MRS] {_fn} ok ({len(_data)} bytes)")
                      else:
                          _old_fp = os.path.join("Clash", _fn)
                          if os.path.exists(_old_fp):
                              shutil.copy(_old_fp, os.path.join(dest, _fn))
                              ok += 1
                              print(f"  [Clash MRS] {_fn} fetch failed, kept old version")
                          else:
                              print(f"  [Clash MRS] FAIL {_url}")

              print(f"[{client}] done: {ok} files")
          PYEOF

      - name: Atomic publish to rules branch
        run: |
          set -e
          # Rules live on the rules branch; master holds only the workflow,
          # README and LICENSE (2026-11-07 restructure).
          git fetch origin rules
          git checkout -B rules origin/rules
          rm -rf Loon Egern Surge Clash QuantumultX
          cp -r /tmp/new/Loon Loon
          cp -r /tmp/new/Egern Egern
          cp -r /tmp/new/Surge Surge
          cp -r /tmp/new/Clash Clash
          cp -r /tmp/new/QuantumultX QuantumultX
          echo "published: $(ls Loon | wc -l) loon, $(ls Egern | wc -l) egern, $(ls Surge | wc -l) surge, $(ls Clash | wc -l) clash, $(ls QuantumultX | wc -l) qx"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: sync rules $(date -u +%Y-%m-%d)"
            git push origin rules
          fi
